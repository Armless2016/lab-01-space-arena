name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript strict check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit and property tests with shared coverage threshold
        run: npm run test:coverage
      - name: Deterministic simulation smoke test
        run: npm run test:shared
      - name: Build browser and production server
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Two-client browser test
        run: npm run test:e2e
      - name: Malformed WebSocket isolation experiment
        shell: bash
        run: |
          npm run dev --workspace=./server > /tmp/space-arena-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:3000/health
          npm run test:ws-abuse
      - name: Build production Docker image
        run: docker build --build-arg BUILD_SHA=${GITHUB_SHA} -t space-arena:local .
      - name: Verify Docker size and graceful SIGTERM with a connected WebSocket client
        run: npm run docker:test:shutdown
